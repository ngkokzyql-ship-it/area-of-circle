<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>圓面積推導：逐層依序平鋪</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            color: #eee;
            padding: 20px;
        }
        canvas {
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .controls {
            margin-top: 25px;
            width: 500px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #ffcc00;
        }
        .info {
            margin-top: 10px;
            color: #ffcc00;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .guide { color: #888; font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>逐層平鋪：外環完成後內環才開始</h2>
    
    <canvas id="canvas" width="800" height="500"></canvas>

    <div class="controls">
        <input type="range" id="progress" min="0" max="1" step="0.0001" value="0">
        <div class="info" id="status">準備開始...</div>
        <div class="guide">(由最外層開始，一條接一條)</div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('progress');
    const statusText = document.getElementById('status');

    const centerX = canvas.width / 2;
    const centerY = 200; 
    const maxRadius = 100; // 圓形大小
    const ringCount = 30;  // 環的數量，30層效果較清晰

    function draw() {
        const t = parseFloat(slider.value);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 判斷目前正在動的是哪一個環 (從最外層 i=ringCount 開始)
        // activeIndex 會從 ringCount 變到 1
        let activeIndex = ringCount - Math.floor(t * ringCount);
        if (t >= 1) activeIndex = 0; 

        statusText.innerText = t <= 0 ? "圓形狀態" : (t >= 1 ? "轉化完成 (三角形)" : `正在處理第 ${ringCount - activeIndex + 1} 層環`);

        for (let i = 1; i <= ringCount; i++) {
            const r = (i / ringCount) * maxRadius;
            const halfCircumference = Math.PI * r;
            const anchorY = centerY + r; // 底點固定

            // 計算這個環專屬的進度
            const segment = 1 / ringCount;
            const ringStart = (ringCount - i) * segment;
            const ringEnd = ringStart + segment;
            
            let ringT = (t - ringStart) / segment;
            ringT = Math.max(0, Math.min(1, ringT));

            ctx.beginPath();
            ctx.lineWidth = 2.5;
            // 漸變色
            ctx.strokeStyle = `hsl(${20 + (i/ringCount)*40}, 90%, 60%)`;

            if (ringT === 0) {
                // 還沒輪到它：保持圓形
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
            } else if (ringT > 0 && ringT < 1) {
                // 正在攤開中
                const angleSpan = Math.PI * (1 - ringT);
                
                // 繪製底部剩餘弧線
                ctx.arc(centerX, centerY, r, Math.PI/2 - angleSpan, Math.PI/2 + angleSpan, false);
                
                // 取得斷開點
                const xOffset = r * Math.sin(angleSpan);
                const yOffset = r * Math.cos(angleSpan);
                const endY = centerY + yOffset;

                // 水平伸展長度
                const unrolledLen = halfCircumference * ringT;
                
                ctx.moveTo(centerX - xOffset, endY);
                ctx.lineTo(centerX - xOffset - unrolledLen, endY);
                
                ctx.moveTo(centerX + xOffset, endY);
                ctx.lineTo(centerX + xOffset + unrolledLen, endY);
            } else {
                // 已經攤開完成：直接顯示水平線
                ctx.moveTo(centerX - halfCircumference, anchorY);
                ctx.lineTo(centerX + halfCircumference, anchorY);
            }
            ctx.stroke();
        }

        // 裝飾：圓心參考點
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    slider.addEventListener('input', draw);
    window.onload = draw;
</script>

</body>
</html>
